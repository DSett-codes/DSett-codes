name: generate snake game from github contribution grid

on:
  schedule:
    # Runs exactly once a day at midnight UTC (100% standard syntax)
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Allows you to trigger it via API or repository events to prevent 60-day sleep
  repository_dispatch:
    types: [keepalive]

permissions:
  contents: write

jobs:
  build:
    name: jobs to generate svg and pngs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # CRITICAL: Need to clone the repo first so actions can interact with the files
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Debvex
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
